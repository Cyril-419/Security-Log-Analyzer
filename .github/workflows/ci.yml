name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets me re-run it by hand from the Actions tab

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# If I push twice quickly, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest -v

  smoke:
    name: CLI and API smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: CLI finds every planted attack in the sample logs
        run: |
          python -m loganalyzer analyze sample_logs/* --year 2026 --json > result.json
          python - <<'EOF'
          import json
          r = json.load(open("result.json"))
          rules = sorted(a["rule"] for a in r["alerts"])
          print(f"{r['summary']['events']} events -> {rules}")
          assert len(rules) == 9, "expected 3 planted attacks in each of the 3 sample logs"
          assert set(rules) == {"brute_force", "password_spray", "success_after_failures"}
          EOF

      - name: REST API answers /health and /analyze
        run: |
          python -m loganalyzer serve --port 8080 &
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 0.5; done
          python -c "import json; print(json.dumps({'format': 'linux', 'year': 2026, 'logs': open('sample_logs/auth.log').read()}))" > request.json
          curl -sf -X POST localhost:8080/analyze -H "Content-Type: application/json" \
               --data-binary @request.json -o response.json
          python -c "import json; r = json.load(open('response.json')); print(r['summary']); assert r['summary']['alerts'] == 3"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8080/analyze \
                 -H "Content-Type: application/json" -d '{bad json')
          echo "bad JSON -> HTTP $code"; test "$code" = "400"

  benchmark:
    name: Benchmark (100k events)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Throughput and detection accuracy
        run: python scripts/benchmark.py --events 100000
